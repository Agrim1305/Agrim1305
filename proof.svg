<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564"><style>@font-face{font-family:Brico;font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:News;font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Brico;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Mono;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.b8{font-family:Brico,system-ui,sans-serif;font-weight:800}.b5{font-family:Brico,system-ui,sans-serif;font-weight:500}.ni{font-family:News,Georgia,serif;font-style:italic}.m4{font-family:Mono,ui-monospace,monospace}.m5{font-family:Mono,ui-monospace,monospace;font-weight:500}</style>
<defs><clipPath id="r"><rect width="1200" height="564" rx="24"/></clipPath></defs><g clip-path="url(#r)"><rect width="1200" height="564" fill="#0F0F11"/><rect x=".5" y=".5" width="1199" height="563" rx="24" fill="none" stroke="#F1EFEA" stroke-opacity=".09"/><text class="m5" x="48" y="60" font-size="12.5" fill="#FF5B2E" letter-spacing="1.8">THE 30-SECOND VERSION</text><text class="b8" x="46" y="112" font-size="40" fill="#F1EFEA" letter-spacing="-1.2">A graduate engineer who has <tspan class="ni" font-weight="400" fill="#FF5B2E">already shipped.</tspan></text><line x1="48" y1="150" x2="1152" y2="150" stroke="#F1EFEA" stroke-opacity=".08"/><circle cx="62" cy="198" r="14" fill="#FF5B2E" fill-opacity=".14"/><path d="M55 198 l5 5 l10 -10" fill="none" stroke="#FF5B2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="b8" x="96" y="206" font-size="23" fill="#F1EFEA" letter-spacing="-.4">Ships to production</text><text class="b5" x="390" y="205" font-size="17" fill="#A6A39E">MetaPlay is live, a client site is live, and my portfolio runs its own AI assistant.</text><line x1="48" y1="246" x2="1152" y2="246" stroke="#F1EFEA" stroke-opacity=".08"/><circle cx="62" cy="294" r="14" fill="#FF5B2E" fill-opacity=".14"/><path d="M55 294 l5 5 l10 -10" fill="none" stroke="#FF5B2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="b8" x="96" y="302" font-size="23" fill="#F1EFEA" letter-spacing="-.4">Works in industry</text><text class="b5" x="390" y="301" font-size="17" fill="#A6A39E">Software engineering intern on voice AI at Aurivox, 1 of 4 chosen from 11 applicants.</text><line x1="48" y1="342" x2="1152" y2="342" stroke="#F1EFEA" stroke-opacity=".08"/><circle cx="62" cy="390" r="14" fill="#FF5B2E" fill-opacity=".14"/><path d="M55 390 l5 5 l10 -10" fill="none" stroke="#FF5B2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="b8" x="96" y="398" font-size="23" fill="#F1EFEA" letter-spacing="-.4">Delivers under pressure</text><text class="b5" x="390" y="397" font-size="17" fill="#A6A39E">Top 12 of 75 at a national hackathon, built in 44 hours with a team from three universities.</text><line x1="48" y1="438" x2="1152" y2="438" stroke="#F1EFEA" stroke-opacity=".08"/><circle cx="62" cy="486" r="14" fill="#FF5B2E" fill-opacity=".14"/><path d="M55 486 l5 5 l10 -10" fill="none" stroke="#FF5B2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="b8" x="96" y="494" font-size="23" fill="#F1EFEA" letter-spacing="-.4">Leads people</text><text class="b5" x="390" y="493" font-size="17" fill="#A6A39E">As club president I grew membership from 10 to 100+, led a merger and won Club of the Year.</text></g></svg>